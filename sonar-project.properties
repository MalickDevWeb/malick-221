# Configuration SonarQube / SonarCloud - Malick Buss Monorepo
sonar.projectKey=malick-buss
sonar.projectName=Malick Buss Marketplace
sonar.projectVersion=1.0.0

# Encodage des fichiers sources
sonar.sourceEncoding=UTF-8

# Répertoires sources à analyser
sonar.sources=backend/src,frontend/src,back-office/src,shared/src

# Répertoires de tests
sonar.tests=backend/test
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts

# Exclusions de l'analyse (fichiers générés, dépendances, bundles)
sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/.system_generated/**,\
  backend/prisma/migrations/**,\
  backend/prisma/schema.prisma,\
  frontend/public/**,\
  back-office/public/**,\
  **/*.d.ts,\
  **/*.svg,\
  **/*.png,\
  **/*.jpg,\
  **/*.ico

# Exclusions spécifiques pour le calcul de la couverture de tests
sonar.coverage.exclusions=\
  **/*.spec.ts,\
  **/*.test.ts,\
  backend/prisma/**,\
  backend/src/main.ts,\
  shared/dist/**,\
  **/node_modules/**

# Chemins des rapports de couverture LCOV
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# Règles TypeScript / JavaScript
sonar.typescript.tsconfigPaths=tsconfig.base.json,backend/tsconfig.json,frontend/tsconfig.json,back-office/tsconfig.json,shared/tsconfig.json

