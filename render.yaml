services:
  - type: web
    name: malick-buss-api
    env: node
    plan: starter
    region: frankfurt
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /docs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_CLIENT_URL
        sync: false
      - key: DEFAULT_COMMISSION_PERCENTAGE
        value: "10"
      - key: DEFAULT_SHIPPING_FEE_PER_SHOP
        value: "3000"
      - key: STOCK_RESERVATION_MINUTES
        value: "15"
      - key: SUPER_ADMIN_PASSWORD
        sync: false
