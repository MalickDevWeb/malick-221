services:
  - type: web
    name: malick-buss-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: .
    branch: main
    autoDeployTrigger: "yes"
    buildCommand: npm ci --include=dev && npm run build:shared && npm run prisma:generate --workspace=backend && npm run build:backend
    preDeployCommand: npx prisma migrate deploy --schema backend/prisma/schema.prisma
    startCommand: npm run start:prod --workspace=backend
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://frontend-malickdevwebs-projects.vercel.app,https://back-office-malickdevwebs-projects.vercel.app"
      - key: FRONTEND_CLIENT_URL
        value: "https://frontend-malickdevwebs-projects.vercel.app"
      - key: DEFAULT_COMMISSION_PERCENTAGE
        value: "10"
      - key: DEFAULT_SHIPPING_FEE_PER_SHOP
        value: "3000"
      - key: STOCK_RESERVATION_MINUTES
        value: "15"
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        value: djp423xyr
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
